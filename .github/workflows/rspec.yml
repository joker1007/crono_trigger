name: RSpec

on:
  schedule:
    - cron: "0 9 * * 1"
  push:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.4', '4.0']
        gemfile:
          - Gemfile
          - gemfiles/activerecord-71.gemfile
          - gemfiles/activerecord-80.gemfile
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
    # To automatically get bug fixes and new Ruby versions for ruby/setup-ruby,
    # change this to (see https://github.com/ruby/setup-ruby#versioning):
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run tests
      run: bundle exec rake

  test-mysql:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.4', '4.0']
        gemfile:
          - Gemfile
          - gemfiles/activerecord-71.gemfile
          - gemfiles/activerecord-80.gemfile
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      DB: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run tests
      run: bundle exec rake
      env:
        # `job` context is only available in step level
        MYSQL_RESTART_COMMAND: >-
          docker restart ${{ job.services.mysql.id }} &&
          until docker exec ${{ job.services.mysql.id }} mysqladmin ping -h 127.0.0.1 --silent; do sleep 1; done

  test-postgresql:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.4', '4.0']
        gemfile:
          - Gemfile
          - gemfiles/activerecord-71.gemfile
          - gemfiles/activerecord-80.gemfile
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      DB: postgresql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run tests
      run: bundle exec rake
